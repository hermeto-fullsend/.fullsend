---
# fullsend-stage: backend-parity
name: Backend Parity

permissions:
  actions: write
  contents: read
  id-token: write
  issues: write

on:
  workflow_dispatch:
    inputs:
      event_type:
        required: true
        type: string
      source_repo:
        required: true
        type: string
      event_payload:
        required: true
        type: string

concurrency:
  group: fullsend-backend-parity
  cancel-in-progress: true

jobs:
  backend-parity:
    uses: fullsend-ai/fullsend/.github/workflows/reusable-agent.yml@v0
    with:
      event_type: ${{ inputs.event_type }}
      source_repo: ${{ inputs.source_repo }}
      event_payload: ${{ inputs.event_payload }}
      mint_url: ${{ vars.FULLSEND_MINT_URL }}
      gcp_region: ${{ vars.FULLSEND_GCP_REGION }}
      install_mode: per-org
      runner_image: ubuntu-24.04
    secrets:
      FULLSEND_GCP_WIF_PROVIDER: ${{ secrets.FULLSEND_GCP_WIF_PROVIDER }}
      FULLSEND_GCP_PROJECT_ID: ${{ secrets.FULLSEND_GCP_PROJECT_ID }}
