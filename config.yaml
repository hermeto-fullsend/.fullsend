# fullsend organization configuration
# https://github.com/fullsend-ai/fullsend
#
# This file is managed by fullsend. Manual edits may be overwritten.
version: "1"
dispatch:
    platform: github-actions
    mode: oidc-mint
inference:
    provider: vertex
defaults:
    roles:
        - fullsend
        - triage
        - coder
        - review
        - retro
        - prioritize
    max_implementation_retries: 2
    auto_merge: false
repos:
    .fullsend:
        enabled: false
    .github:
        enabled: false
    hermeto:
        enabled: false
    workflows:
        enabled: false
agents:
    - name: code
      source: harness/code.yaml
    - name: triage
      source: harness/triage.yaml
    - name: review
      source: harness/review.yaml
    - name: fix
      source: harness/fix.yaml
    - name: retro
      source: harness/retro.yaml
    - name: prioritize
      source: harness/prioritize.yaml
    - name: compat-monitor
      source: harness/compat-monitor.yaml
allowed_remote_resources:
    - https://raw.githubusercontent.com/fullsend-ai/fullsend/
    - https://raw.githubusercontent.com/fullsend-ai/agents/
